<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamp catalogue — shadow box</title>
<style>
  :root{--light:#ffe7b4;--card:#1c1006;--ink:#4a2f12}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a09;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#e7d6b8;padding:28px}
  h1{font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  p.sub{color:#9c8a6a;margin-bottom:24px;font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .cell{background:var(--light);border-radius:10px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .cell svg{display:block;width:100%;height:auto}
  .cap{padding:8px 12px;background:#15120c;color:#cdbfa0;font-size:.8rem;display:flex;justify-content:space-between}
  .cap b{color:#fff;font-weight:600}
  .cap span{color:#8d7c5d}
</style>
</head>
<body>
<h1>Stamp catalogue</h1>
<p class="sub">Each NZ-bush paper-cut stamp on the lit panel — perfected in isolation, then placed in the scene.</p>
<div class="grid" id="grid"></div>

<script src="stamps.js"></script>
<script>
  const CARD='#1c1006';
  // each entry: [label, te-reo/latin, builder(returns svg inner), baseY, vbH]
  const W=220, H=260, B=232;   // cell width, height, baseline
  const items=[
    ['Tree fern','ponga',      ()=>treeFern(110,B,210,CARD,13)],
    ['Cabbage tree','tī kōuka',()=>cabbageTree(110,B,200,CARD,12)],
    ['Nīkau palm','nīkau',     ()=>nikau(110,B,220,CARD,101)],
    ['Conifer','kahikatea',    ()=>conifer(110,B,224,CARD,49,{droop:22,density:0.9})],
    ['Canopy tree','rātā',     ()=>canopyTree(110,B,200,CARD,103)],
    ['Flax','harakeke',        ()=>flax(110,B,170,CARD,7)],
    ['Toetoe','plume grass',   ()=>toetoe(110,B,200,CARD,5)],
    ['Grass tuft','',          ()=>grass(110,B,120,80,16,CARD,201)],
    ['Fern frond','',          ()=>frond(110,B,150,CARD,9,-92)],
    ['Koru','fiddlehead',      ()=>koru(110,B,180,CARD,4,1)],
    ['Kiwi','',                ()=>kiwi(110,150,1.0,CARD)],
    ['Fantail','pīwakawaka',   ()=>fantail(110,130,2.4,CARD)],
    ['Tui','',                 ()=>tui(110,130,2.6,CARD)],
    ['Birds (hole)','',        ()=>bird(70,120,2.2,CARD)+bird(140,140,2.6,CARD)],
  ];
  const grid=document.getElementById('grid');
  for(const [label,sub,build] of items){
    const cell=document.createElement('div');cell.className='cell';
    cell.innerHTML=
      `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${build()}</svg>`+
      `<div class="cap"><b>${label}</b><span>${sub}</span></div>`;
    grid.appendChild(cell);
  }
</script>
</body>
</html>
